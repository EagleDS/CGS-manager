<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Withdrawn Fights — CGS</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080a;--surf:#0f0f12;--surf2:#16161a;--border:#222228;--dim:#3a3a42;
  --text:#f0f0f4;--muted:#64646e;
  --gold:#f0b429;--gold-dk:#c89010;--gold-bg:#120e00;
  --red:#e03030;--red-dk:#a02020;--red-bg:#120404;
  --green:#20b040;--green-bg:#021008;
  --orange:#f07020;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;min-height:100vh;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:2px;height:2px}::-webkit-scrollbar-thumb{background:#333}
#toast{position:fixed;top:56px;right:10px;z-index:500;font-family:var(--mono);font-size:10px;padding:7px 12px;border-radius:2px;display:none;max-width:260px;line-height:1.5}
#toast.show{display:block}
.hdr{background:#0a0a0d;border-bottom:2px solid var(--red);padding:0 14px;height:48px;box-sizing:border-box;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;color:var(--red);flex:1}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex-shrink:0;transition:background .3s}
.sync-dot.live{background:var(--green);box-shadow:0 0 6px var(--green)}
.sync-dot.err{background:var(--red)}
.btn{border:none;cursor:pointer;font-family:var(--mono);font-weight:600;letter-spacing:.8px;border-radius:2px;padding:7px 14px;font-size:11px;-webkit-tap-highlight-color:transparent;user-select:none}
.btn-green{background:#156030;color:#fff}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--muted)}.btn-ghost:hover{border-color:#555;color:var(--text)}
.btn-xs{padding:3px 7px;font-size:9px}
.body{padding:12px;max-width:640px;margin:0 auto}
.empty{text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px;padding:40px 20px}
.card{background:var(--surf);border:1px solid var(--red-dk);border-radius:3px;margin-bottom:8px;overflow:hidden;opacity:.9}
.card-hdr{padding:6px 10px;background:#120505;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9px;color:var(--muted)}
.card-mat{margin-left:auto;color:var(--red)}
.card-body{padding:10px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.c-name{font-weight:600;font-size:13px;line-height:1.2}
.c-club{font-size:9px;color:var(--muted)}
.c-vs{font-family:'Bebas Neue',sans-serif;font-size:12px;color:var(--dim);text-align:center}
.card-foot{padding:6px 10px 10px;text-align:right}
</style>
</head>
<body>

<div id="toast"></div>

<div class="hdr">
  <div class="hdr-title">✕ WITHDRAWN FIGHTS</div>
  <div class="sync-dot" id="sync-dot" title="Firebase sync"></div>
  <a href="https://eagleds.github.io/CGS-manager/mars.html" style="text-decoration:none"><button class="btn btn-ghost btn-xs">MARSHAL →</button></a>
</div>

<div class="body" id="withdrawn-list"></div>

<script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, set, onValue } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const params = new URLSearchParams(location.search);
const eventId = params.get('event') || 'cgs-july-11-2026';

let bouts = [], db = null;

function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function toast(msg,type='gold'){
  const t=document.getElementById('toast');
  const colors={gold:['#1a1000','var(--gold)'],green:['var(--green-bg)','var(--green)'],red:['var(--red-bg)','var(--red)']};
  const[bg,bc]=colors[type]||colors.gold;
  t.textContent=msg;t.style.background=bg;t.style.border='1px solid '+bc;t.style.color='#fff';t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

function updateSyncDot(state){const d=document.getElementById('sync-dot');if(d)d.className='sync-dot '+state;}

function saveBouts(){
  if(!db)return;
  set(ref(db,`events/${eventId}/bouts`),bouts).catch(()=>{updateSyncDot('err');toast('Sync failed — check connection','red');});
}

window.restoreBout=function(id){
  const b=bouts.find(x=>x.id===id);if(!b)return;
  if(!confirm('Restore '+b.id+' ('+b.red.name+' vs '+b.blue.name+') back to '+b.area+'?'))return;
  b.status='scheduled';
  saveBouts();renderList();
  toast(b.id+' restored to '+b.area,'green');
};

function renderList(){
  const withdrawn=bouts.filter(b=>b.status==='cancelled');
  const el=document.getElementById('withdrawn-list');
  if(!withdrawn.length){el.innerHTML='<div class="empty">No withdrawn fights.</div>';return;}
  el.innerHTML=withdrawn.map(b=>
    '<div class="card">'
    +'<div class="card-hdr"><span>'+b.id+'</span><span>'+escH(b.disc)+' · '+escH(b.ageGrp)+'</span><span class="card-mat">was '+escH(b.area)+'</span></div>'
    +'<div class="card-body">'
    +'<div><div class="c-name" style="color:var(--red)">'+escH(b.red.name)+'</div><div class="c-club">'+escH(b.red.club||'')+'</div></div>'
    +'<div class="c-vs">VS</div>'
    +'<div style="text-align:right"><div class="c-name" style="color:var(--blue)">'+escH(b.blue.name)+'</div><div class="c-club">'+escH(b.blue.club||'')+'</div></div>'
    +'</div>'
    +'<div class="card-foot"><button class="btn btn-green btn-xs" data-bid="'+b.id+'" onclick="restoreBout(this.dataset.bid)">↺ RESTORE TO DRAW</button></div>'
    +'</div>'
  ).join('');
}

function initFirebase(){
  const cfg={
    apiKey:"AIzaSyDKqodxFjM0EG_qu4zkCAQ37udwYTdSSQY",
    authDomain:"cgs-manager.firebaseapp.com",
    databaseURL:"https://cgs-manager-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:"cgs-manager",
    storageBucket:"cgs-manager.firebasestorage.app",
    messagingSenderId:"928662574013",
    appId:"1:928662574013:web:be540e308d022d28f678d4"
  };
  try{
    const existing=getApps().find(a=>a.name==='cgs-withdrawn');
    const app=existing||initializeApp(cfg,'cgs-withdrawn');
    db=getDatabase(app);
    updateSyncDot('live');
    onValue(ref(db,`events/${eventId}/bouts`),snap=>{
      if(!snap.exists())return;
      const data=snap.val();
      if(Array.isArray(data)){bouts=data;renderList();}
    });
  }catch(e){updateSyncDot('err');toast('Firebase connection failed','red');console.warn(e);}
}

initFirebase();
</script>
</body>
</html>
