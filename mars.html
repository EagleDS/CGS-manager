<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Marshal — CGS</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080a;--surf:#0f0f12;--surf2:#16161a;--border:#222228;--dim:#3a3a42;
  --text:#f0f0f4;--muted:#64646e;
  --gold:#f0b429;--gold-dk:#c89010;--gold-bg:#120e00;
  --red:#e03030;--red-dk:#a02020;--red-bg:#120404;
  --green:#20b040;--green-bg:#021008;
  --orange:#f07020;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;min-height:100vh;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:2px;height:2px}::-webkit-scrollbar-thumb{background:#333}
#toast{position:fixed;top:56px;right:10px;z-index:500;font-family:var(--mono);font-size:10px;padding:7px 12px;border-radius:2px;display:none;max-width:260px;line-height:1.5}
#toast.show{display:block}
.hdr{background:#0a0a0d;border-bottom:2px solid var(--gold);padding:0 14px;height:48px;box-sizing:border-box;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;color:var(--gold);flex:1}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex-shrink:0;transition:background .3s}
.sync-dot.live{background:var(--green);box-shadow:0 0 6px var(--green)}
.sync-dot.err{background:var(--red)}
.btn{border:none;cursor:pointer;font-family:var(--mono);font-weight:600;letter-spacing:.8px;border-radius:2px;padding:7px 14px;font-size:11px;-webkit-tap-highlight-color:transparent;user-select:none}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--muted)}.btn-ghost:hover{border-color:#555;color:var(--text)}
.btn-xs{padding:3px 7px;font-size:9px}
.flag{display:inline-flex;align-items:center;font-family:var(--mono);font-size:8px;font-weight:700;padding:2px 4px;border-radius:2px;letter-spacing:.5px;white-space:nowrap;margin:1px}
.f-lv{background:var(--red-bg);border:1px solid var(--red);color:var(--red)}
.f-dn{background:var(--green-bg);border:1px solid var(--green);color:var(--green)}
.f-nh{background:#1a0e00;border:1px solid #6a3800;color:#e09020}
.f-ex{background:#12061a;border:1px solid #4a2a6a;color:#9060d0}
.f-ag{background:#1a1000;border:1px solid #6a5000;color:#d0a000}
.draw-mat-cols{display:flex;gap:8px;overflow-x:auto;padding:8px;padding-bottom:24px;-webkit-overflow-scrolling:touch;min-height:calc(100vh - 52px)}
.draw-mat-col{flex:0 0 280px;background:var(--surf);border:1px solid var(--border);border-radius:3px;overflow:hidden}
@media(min-width:800px){.draw-mat-col{flex:1;min-width:260px}}
.draw-mat-hdr{background:#0d0d10;border-bottom:2px solid var(--gold);padding:8px 12px;display:flex;align-items:center;gap:8px}
.draw-mat-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;color:var(--gold)}
.draw-mat-count{font-family:var(--mono);font-size:9px;color:var(--muted);margin-left:auto}
.draw-mat-list{padding:5px;user-select:none;-webkit-user-select:none}
.draw-mat-list *{user-select:none;-webkit-user-select:none}
.draw-bout-row{background:#0d0d10;border:1px solid var(--border);border-radius:3px;margin-bottom:4px;overflow:hidden;transition:border-color .15s}
.draw-bout-row.live{border-color:var(--red)}
.draw-bout-row.done{opacity:.5;border-color:#0a2010}
.draw-bout-row.flagged{border-color:var(--orange)}
.draw-bout-row.dragging{opacity:.3}
.draw-bout-row.drag-over{border-color:var(--gold)!important;background:#1a1200!important}
.draw-bout-hdr{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid #111115}
.draw-fight-num{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold);min-width:32px;line-height:1}
.draw-disc-tag{font-family:var(--mono);font-size:8px;color:var(--muted);flex:1}
.draw-bout-body{padding:5px 8px 6px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px}
.draw-name{font-weight:600;font-size:12px;line-height:1.2}
.draw-club{font-size:9px;color:var(--muted)}
.draw-vs{font-family:'Bebas Neue',sans-serif;font-size:11px;color:var(--dim);text-align:center}
.draw-handle{color:var(--dim);font-size:13px;cursor:grab;padding:0 2px;touch-action:none;flex-shrink:0}
.draw-inline-replace{padding:4px 6px 6px;border-top:1px solid #111115;display:flex;gap:4px;flex-wrap:wrap}
.inline-sel{flex:1;min-width:120px;background:#080808;border:1px solid var(--border);color:var(--text);padding:3px 6px;border-radius:2px;font-family:var(--mono);font-size:9px;-webkit-appearance:none}
.inline-sel:focus{outline:none;border-color:var(--gold)}
.undo-btn{background:#1a1000;border:1px solid #4a3000;color:var(--gold);font-family:var(--mono);font-size:9px;padding:3px 8px;border-radius:2px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.undo-btn:hover{background:#2a1800}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;align-items:flex-end;justify-content:center}
#overlay.show{display:flex}
.modal{background:#0f0f12;border:1px solid var(--border);border-top:2px solid var(--gold);border-radius:4px 4px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:18px;padding-bottom:32px}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;margin-bottom:12px;color:var(--gold)}
.fld{margin-bottom:10px}
.fld label{font-family:var(--mono);font-size:8px;letter-spacing:1.5px;color:var(--muted);display:block;margin-bottom:3px;text-transform:uppercase}
.fld input,.fld select{width:100%;background:#0a0a0d;border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:2px;font-family:var(--mono);font-size:11px;-webkit-appearance:none}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--gold)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.corner-hdr{font-family:var(--mono);font-size:9px;letter-spacing:1px;margin:12px 0 6px;text-transform:uppercase}
.row-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.btn-gold{background:var(--gold-dk);color:#000}.btn-gold:hover{background:var(--gold)}
</style>
</head>
<body>

<div id="toast"></div>

<div class="hdr">
  <div class="hdr-title">📋 MARSHAL</div>
  <button class="btn btn-gold btn-xs" onclick="openAddMatch()">+ ADD MATCH</button>
  <div class="sync-dot" id="sync-dot" title="Firebase sync"></div>
  <a href="https://eagleds.github.io/CGS-manager/wd.html" style="text-decoration:none"><button class="btn btn-ghost btn-xs" style="color:var(--red);border-color:var(--red-dk)">WITHDRAWN</button></a>
</div>

<div class="draw-mat-cols" id="draw-mat-cols"></div>

<div id="overlay" onclick="closeAddMatch()">
  <div class="modal" onclick="event.stopPropagation()" id="modal-box"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, set, onValue } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

// ── Same event as CGS Manager. Override with ?event=your-event-id if needed. ──
const params = new URLSearchParams(location.search);
const eventId = params.get('event') || 'cgs-july-11-2026';

let bouts = [], storedRegs = {}, db = null;

function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escA(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;');}
function normS(s){return String(s||'').trim().toLowerCase().replace(/[^a-z0-9]/g,' ').replace(/\s+/g,' ').trim();}
function jaccardSim(a,b){const sa=new Set(a.split(' ').filter(x=>x.length>1));const sb=new Set(b.split(' ').filter(x=>x.length>1));if(!sa.size&&!sb.size)return 1;let inter=0;sa.forEach(w=>{if(sb.has(w))inter++;});return inter/(sa.size+sb.size-inter||1);}
function findRegKeyByFullName(fullName){
  if(!fullName)return null;
  const target=normS(fullName);
  let best=null,bestScore=0;
  Object.entries(storedRegs).forEach(([k,a])=>{const full=((a.name||'')+' '+(a.sur||'')).trim();const s=jaccardSim(target,normS(full));if(s>bestScore){bestScore=s;best=k;}});
  return bestScore>0.5?best:null;
}
function isUnpaid(fullName){
  if(!fullName||fullName==='TBC')return false;
  const key=findRegKeyByFullName(fullName);
  if(!key)return false;
  const reg=storedRegs[key];
  if(!reg)return false;
  return !(reg.checkin&&reg.checkin.paid);
}

function toast(msg,type='gold'){
  const t=document.getElementById('toast');
  const colors={gold:['#1a1000','var(--gold)'],green:['var(--green-bg)','var(--green)'],red:['var(--red-bg)','var(--red)'],orange:['#1a0e00','var(--orange)']};
  const[bg,bc]=colors[type]||colors.gold;
  t.textContent=msg;t.style.background=bg;t.style.border='1px solid '+bc;t.style.color='#fff';t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

function updateSyncDot(state){const d=document.getElementById('sync-dot');if(d)d.className='sync-dot '+state;}

function saveBouts(){
  if(!db)return;
  set(ref(db,`events/${eventId}/bouts`),bouts).catch(()=>{updateSyncDot('err');toast('Sync failed — check connection','red');});
}

let boutHistory = {};

function buildInlineDrop(b,corner){
  const current=b[corner],other=corner==='red'?b.blue:b.red;
  const pool=bouts.filter(x=>x.disc===b.disc&&x.div===b.div&&x.id!==b.id&&x.status!=='completed')
    .flatMap(x=>[
      {name:x.red.name,club:x.red.club||'',age:x.red.age||0,weight:x.red.wt||0},
      {name:x.blue.name,club:x.blue.club||'',age:x.blue.age||0,weight:x.blue.wt||0}
    ])
    .filter((f,i,a)=>a.findIndex(y=>y.name===f.name)===i&&f.name!==current.name&&f.name!=='TBC');
  pool.sort((a,x)=>Math.abs(a.weight-(other.wt||0))-Math.abs(x.weight-(other.wt||0)));
  const label='— '+(current.name||'TBC')+' —';
  const opts=pool.slice(0,12).map(f=>{
    const val=encodeURIComponent(f.name)+'|'+encodeURIComponent(f.club)+'|'+f.age+'|'+f.weight;
    return '<option value="'+val+'">'+escH(f.name)+' · '+escH(f.club)+'</option>';
  }).join('');
  return '<option value="">'+escH(label)+'</option>'+opts+'<option value="__manual__">✎ Manual…</option>';
}

window.inlineReplace=function(sel){
  const bid=sel.dataset.bid,corner=sel.dataset.corner,b=bouts.find(x=>x.id===bid);
  if(!b)return;
  boutHistory[bid]=JSON.parse(JSON.stringify(b));
  if(sel.value==='__manual__'){
    const name=prompt('Fighter name:');
    if(!name){sel.value='';return;}
    const club=prompt('Club:','')||'',age=parseInt(prompt('Age:',''))||0,wt=parseFloat(prompt('Weight kg:',''))||0;
    b[corner]={name,club,age,wt};
  }else if(sel.value){
    const parts=sel.value.split('|');
    b[corner]={name:decodeURIComponent(parts[0]||''),club:decodeURIComponent(parts[1]||''),age:parseInt(parts[2])||0,wt:parseFloat(parts[3])||0};
  }else return;
  b.wtDiff=Math.abs((b.red.wt||0)-(b.blue.wt||0));
  b.ageDiff=Math.abs((b.red.age||0)-(b.blue.age||0));
  b.noHead=Math.min(b.red.age||99,b.blue.age||99)<=12;
  saveBouts();renderDraw();toast('Replaced — tap ↩ to undo','gold');
};

window.closeAddMatch=function(){document.getElementById('overlay').classList.remove('show');};

window.undoBout=function(id){
  const prev=boutHistory[id];if(!prev)return;
  const idx=bouts.findIndex(x=>x.id===id);
  if(idx>-1){bouts[idx]=prev;delete boutHistory[id];}
  saveBouts();renderDraw();toast('Undone','gold');
};

window.withdrawBout=function(id){
  const b=bouts.find(x=>x.id===id);if(!b)return;
  if(!confirm('Withdraw '+b.id+' ('+b.red.name+' vs '+b.blue.name+')?\n\nThis removes it from '+b.area+'. You can restore it from the Withdrawn Fights page.'))return;
  b.status='cancelled';
  saveBouts();renderDraw();
  toast(b.id+' withdrawn','red');
};
window.openAddMatch=function(){
  const discs=[...new Set(bouts.map(b=>b.disc))].sort();
  const mats=[...new Set(bouts.map(b=>b.area))].sort();
  const discOpts=(discs.length?discs:['Hybrid Light','MMA','K1 Light','Boxing Light']).map(d=>'<option value="'+escA(d)+'">'+escH(d)+'</option>').join('');
  const matOpts=(mats.length?mats:['Mat 1','Mat 2']).map(m=>'<option value="'+escA(m)+'">'+escH(m)+'</option>').join('');
  document.getElementById('modal-box').innerHTML=
    '<div class="modal-title">ADD MATCH</div>'
    +'<div class="g2">'
      +'<div class="fld"><label>Discipline</label><select id="am-disc">'+discOpts+'<option value="__other__">✎ Other…</option></select></div>'
      +'<div class="fld"><label>Age Group</label><select id="am-age"><option>Under 12</option><option selected>13-17</option><option>Adult</option></select></div>'
      +'<div class="fld"><label>Division</label><select id="am-div"><option>Male</option><option>Female</option></select></div>'
      +'<div class="fld"><label>Mat</label><select id="am-mat">'+matOpts+'<option value="__other__">✎ Other…</option></select></div>'
    +'</div>'
    +'<div class="corner-hdr" style="color:var(--red)">RED CORNER</div>'
    +'<div class="fld"><label>Name</label><input id="am-r-name" placeholder="Fighter name"/></div>'
    +'<div class="g2">'
      +'<div class="fld"><label>Club</label><input id="am-r-club" placeholder="Club"/></div>'
      +'<div class="fld"><label>Age / Weight (kg)</label><div style="display:flex;gap:6px"><input id="am-r-age" type="number" placeholder="Age"/><input id="am-r-wt" type="number" placeholder="kg"/></div></div>'
    +'</div>'
    +'<div class="corner-hdr" style="color:var(--blue)">BLUE CORNER</div>'
    +'<div class="fld"><label>Name</label><input id="am-b-name" placeholder="Fighter name"/></div>'
    +'<div class="g2">'
      +'<div class="fld"><label>Club</label><input id="am-b-club" placeholder="Club"/></div>'
      +'<div class="fld"><label>Age / Weight (kg)</label><div style="display:flex;gap:6px"><input id="am-b-age" type="number" placeholder="Age"/><input id="am-b-wt" type="number" placeholder="kg"/></div></div>'
    +'</div>'
    +'<div class="row-btns"><button class="btn btn-gold" onclick="submitAddMatch()">+ ADD TO DRAW</button><button class="btn btn-ghost" onclick="closeAddMatch()">CANCEL</button></div>';
  document.getElementById('overlay').classList.add('show');
};

window.submitAddMatch=function(){
  const rName=document.getElementById('am-r-name').value.trim();
  const bName=document.getElementById('am-b-name').value.trim();
  if(!rName||!bName){toast('Both fighter names are required','red');return;}

  let disc=document.getElementById('am-disc').value;
  if(disc==='__other__'){disc=(prompt('Discipline name:')||'').trim();if(!disc){toast('Discipline required','red');return;}}
  let mat=document.getElementById('am-mat').value;
  if(mat==='__other__'){mat=(prompt('Mat name:')||'').trim();if(!mat){toast('Mat required','red');return;}}

  const ageGrp=document.getElementById('am-age').value;
  const div=document.getElementById('am-div').value;
  const rClub=document.getElementById('am-r-club').value.trim();
  const rAge=parseInt(document.getElementById('am-r-age').value)||0;
  const rWt=parseFloat(document.getElementById('am-r-wt').value)||0;
  const bClub=document.getElementById('am-b-club').value.trim();
  const bAge=parseInt(document.getElementById('am-b-age').value)||0;
  const bWt=parseFloat(document.getElementById('am-b-wt').value)||0;

  // Same numbering scheme as sendToDrawTab() in the main app: B001, B002...
  let n=bouts.length+1,newId='B'+String(n).padStart(3,'0');
  while(bouts.find(b=>b.id===newId)){n++;newId='B'+String(n).padStart(3,'0');}

  const newBout={
    id:newId,disc,ageGrp,div,
    red:{name:rName,club:rClub,age:rAge,wt:rWt},
    blue:{name:bName,club:bClub,age:bAge,wt:bWt},
    noHead:Math.min(rAge||99,bAge||99)<=12,
    notes:'',area:mat,status:'scheduled',score:{red:0,blue:0},round:1,winner:null,
    wtDiff:Math.abs(rWt-bWt),ageDiff:Math.abs(rAge-bAge),checkin:{red:null,blue:null}
  };
  bouts.push(newBout);
  saveBouts();renderDraw();closeAddMatch();
  toast(newId+' added to '+mat,'green');
};

function drawBoutRow(b){
  const isLive=b.status==='live',isDone=b.status==='completed'||b.status==='cancelled';
  const cls='draw-bout-row'+(isLive?' live':isDone?' done':b.notes==='Age Flag'?' flagged':'');
  const flags=[];
  if(b.noHead)flags.push('<span class="flag f-nh">⚠</span>');
  if(b.notes==='Exhibition')flags.push('<span class="flag f-ex">★</span>');
  if(b.notes==='Age Flag')flags.push('<span class="flag f-ag">⚠AGE</span>');
  if(isLive)flags.push('<span class="flag f-lv">●</span>');
  if(isDone)flags.push('<span class="flag f-dn">✓</span>');
  const fightLabel=b.matFightNum?'F'+b.matFightNum:b.id;
  const hasUndo=boutHistory[b.id];
  const redDrop=buildInlineDrop(b,'red'),blueDrop=buildInlineDrop(b,'blue');
  const redUnpaid=!isDone&&isUnpaid(b.red.name),blueUnpaid=!isDone&&isUnpaid(b.blue.name);
  const unpaidBadge='<span style="display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--red-bg);border:1px solid var(--red);color:var(--red);font-size:9px;font-weight:700;margin-left:4px;vertical-align:middle" title="Unpaid">$</span>';
  return '<div class="'+cls+'" id="mbr-'+b.id+'" data-bid="'+b.id+'">'
    +'<div class="draw-bout-hdr">'+(!isDone?'<div class="draw-handle">⠿</div>':'')
    +'<div class="draw-fight-num">'+fightLabel+'</div>'
    +'<div class="draw-disc-tag">'+escH(b.disc)+' · '+escH(b.ageGrp)+'</div>'
    +flags.join('')
    +(hasUndo?'<button class="undo-btn" data-bid="'+b.id+'" onclick="undoBout(this.dataset.bid)">↩</button>':'')
    +'</div>'
    +'<div class="draw-bout-body">'
    +'<div><div class="draw-name" style="color:var(--red)">'+escH(b.red.name)+(redUnpaid?unpaidBadge:'')+'</div><div class="draw-club">'+escH(b.red.club||'')+'</div><div class="draw-club">'+(b.red.age?b.red.age+'yr':'')+' '+(b.red.wt?b.red.wt+'kg':'')+'</div></div>'
    +'<div class="draw-vs">VS</div>'
    +'<div style="text-align:right"><div class="draw-name" style="color:var(--blue)">'+(blueUnpaid?unpaidBadge:'')+escH(b.blue.name)+'</div><div class="draw-club">'+escH(b.blue.club||'')+'</div><div class="draw-club">'+(b.blue.age?b.blue.age+'yr':'')+' '+(b.blue.wt?b.blue.wt+'kg':'')+'</div></div>'
    +'</div>'
    +(!isDone?'<div class="draw-inline-replace"><select class="inline-sel" data-bid="'+b.id+'" data-corner="red" onchange="inlineReplace(this)">'+redDrop+'</select><select class="inline-sel" data-bid="'+b.id+'" data-corner="blue" onchange="inlineReplace(this)">'+blueDrop+'</select>'+(!isLive?'<button class="undo-btn" style="color:var(--red);border-color:#5a0000" data-bid="'+b.id+'" onclick="withdrawBout(this.dataset.bid)">WITHDRAW</button>':'')+'</div>':'')
    +'</div>';
}

function renderDraw(){
  const container=document.getElementById('draw-mat-cols');
  if(!container)return;
  if(!bouts.length){container.innerHTML='<div style="font-family:var(--mono);font-size:10px;color:var(--muted);padding:20px">No bouts loaded yet.</div>';return;}
  const mats=[...new Set(bouts.map(b=>b.area))].sort();
  container.innerHTML=mats.map(mat=>{
    const matBouts=bouts.filter(b=>b.area===mat&&b.status!=='cancelled');
    const remaining=matBouts.filter(b=>b.status==='scheduled'||b.status==='live').length;
    return '<div class="draw-mat-col"><div class="draw-mat-hdr"><div class="draw-mat-title">'+mat+'</div><div class="draw-mat-count">'+remaining+' left</div></div>'
      +'<div class="draw-mat-list" data-mat="'+mat+'">'+matBouts.map(b=>drawBoutRow(b)).join('')+'</div></div>';
  }).join('');
  attachDragDrop(container);
}

function attachDragDrop(container){
  container.querySelectorAll('.draw-mat-list').forEach(list=>{
    if(list._sortable)list._sortable.destroy();
    list._sortable=new Sortable(list,{
      animation:150,ghostClass:'drag-over',chosenClass:'dragging',group:'bouts',
      delay:100,delayOnTouchOnly:false,touchStartThreshold:3,
      onEnd:function(evt){
        const fromMat=evt.from.dataset.mat,toMat=evt.to.dataset.mat;
        const movedId=evt.item.dataset.bid,moved=bouts.find(b=>b.id===movedId);
        if(!moved)return;
        if(fromMat!==toMat)moved.area=toMat;

        const lists=fromMat===toMat?[evt.from]:[evt.from,evt.to];
        lists.forEach(listEl=>{
          const items=Array.from(listEl.querySelectorAll('[data-bid]'));
          const ordered=items.map(el=>bouts.find(b=>b.id===el.dataset.bid)).filter(Boolean);
          ordered.forEach((b,i)=>{b.matFightNum=i+1;});
          ordered.forEach(b=>{
            const row=document.getElementById('mbr-'+b.id);
            if(row){const num=row.querySelector('.draw-fight-num');if(num)num.textContent='F'+b.matFightNum;}
          });
          const col=listEl.closest('.draw-mat-col');
          if(col){
            const cntEl=col.querySelector('.draw-mat-count');
            if(cntEl){const rem=ordered.filter(b=>b.status==='scheduled'||b.status==='live').length;cntEl.textContent=rem+' left';}
          }
        });

        // Rebuild bouts array from actual DOM order across ALL mat columns — never guess
        // array positions from indices. Every bout lives in exactly one visible mat
        // column, so concatenating DOM order per column is a complete, lossless
        // reconstruction (same safety pattern as the main CGS Manager DRAW tab).
        const newBouts=[];
        container.querySelectorAll('.draw-mat-list').forEach(listEl=>{
          Array.from(listEl.querySelectorAll('[data-bid]')).forEach(el=>{
            const b=bouts.find(x=>x.id===el.dataset.bid);
            if(b&&newBouts.indexOf(b)===-1)newBouts.push(b);
          });
        });
        bouts.forEach(b=>{if(newBouts.indexOf(b)===-1)newBouts.push(b);});
        bouts=newBouts;
        saveBouts();
        toast(fromMat!==toMat?'Moved to '+toMat:'Reordered','gold');
      }
    });
  });
}
